version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # The runtime is Node 22 (Docker, CI, Render). Types for a newer Node would allow APIs that do not exist
      # at runtime, so @types/node stays on the 22 line. Minor/patch updates are still proposed.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 breaks the toolchain today: typescript-eslint declares a peer range below TS 6.1, so `npm ci`
      # fails. Remove this rule once typescript-eslint supports TypeScript 7
      # (tracking issue: https://github.com/typescript-eslint/typescript-eslint/issues/10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Keep @types/node on the Node 22 line (see the backend entry).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next bundles typescript-eslint, which crashes on TypeScript 7 ("does not support TS 7.0").
      # Remove once typescript-eslint supports it (see the backend entry for the tracking issue).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      # The runtime is Node 22 (CI, Render and @types/node all assume it). A new Node major is a deliberate,
      # coordinated upgrade, not an automatic bump. Patch/minor updates of the 22 line are still proposed.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      # Keep the base image on the Node 22 line (see the backend entry).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
