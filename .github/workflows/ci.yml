name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22" # matches the Dockerfiles and backend engines (>=22)

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit/API tests are fully mocked and need no database or secrets. Coverage is reported, not enforced.
      - run: npm run test:coverage
      - name: Coverage summary
        if: success() || failure()
        run: node ../.github/scripts/coverage-summary.mjs "Backend" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage
          retention-days: 14
      - run: npm run build
      # Fails only on high/critical advisories in production dependencies.
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Public placeholders only - the build must not need real credentials.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: success() || failure()
        run: node ../.github/scripts/coverage-summary.mjs "Frontend" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          retention-days: 14
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  repo-hygiene:
    name: Repo hygiene (secrets, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real .env files or key material are committed
        run: |
          set -eu
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Tracked env files:"; echo "$bad"; exit 1; fi
          pem=$(git ls-files | grep -E '\.(pem|key|p12)$' || true)
          if [ -n "$pem" ]; then echo "Tracked key/cert files:"; echo "$pem"; exit 1; fi
          # Supabase secret keys and service-role JWTs must never appear in source.
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}' -- . ':!*.md' ':!.github' ; then
            echo "Found what looks like a Supabase secret key"; exit 1
          fi
          if git grep -nE 'eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' -- . ':!*.md' ; then
            echo "Found what looks like a committed JWT/service key"; exit 1
          fi
          echo "ok"
      - name: Migration files are well-formed and uniquely ordered
        run: |
          set -eu
          files=$(ls supabase/migrations)
          echo "$files"
          echo "$files" | while read -r f; do
            echo "$f" | grep -Eq '^[0-9]{14}_[a-z0-9_]+\.sql$' || { echo "Bad migration name: $f"; exit 1; }
          done
          dupes=$(echo "$files" | cut -d_ -f1 | sort | uniq -d)
          [ -z "$dupes" ] || { echo "Duplicate migration timestamps: $dupes"; exit 1; }

  docker:
    name: Docker images build and start
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Build production images
        run: |
          docker build --target runner -t swiftcart-backend:ci --build-context certs=./certs backend
          docker build --target runner -t swiftcart-frontend:ci --build-context certs=./certs \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder frontend
      - name: Smoke test (placeholder credentials; no real Supabase)
        run: |
          set -eu
          docker run -d --name api -p 4000:4000 \
            -e SUPABASE_URL=https://ci-placeholder.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-placeholder-not-a-real-key-000000 swiftcart-backend:ci
          docker run -d --name web -p 3000:3000 swiftcart-frontend:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:4000/api/v1/health >/dev/null 2>&1 && curl -fsS http://localhost:3000/login >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:4000/api/v1/health
          curl -fsS -o /dev/null http://localhost:3000/login
          test "$(docker exec api id -un)" = "app"
          test "$(docker exec web id -un)" = "app"
      - name: Show logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true

