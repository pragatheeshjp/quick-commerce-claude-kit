name: Apply database migrations

# Manual only. Applies supabase/migrations/* to the PRODUCTION Supabase project.
# Protect it: create a GitHub Environment named "production" with required reviewers, so every run
# needs an explicit approval. Secrets are referenced by name only; none are stored in this file.
on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the production project ref to confirm (must equal the SUPABASE_PROJECT_REF variable)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    if: inputs.confirm_project_ref == vars.SUPABASE_PROJECT_REF
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest # pin to an exact version once you have run this successfully
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Show pending migrations (dry run)
        run: supabase db push --remote --dry-run
      - name: Apply migrations
        run: supabase db push --remote --yes
